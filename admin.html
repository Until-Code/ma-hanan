<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanan — Responses</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:32px 18px}.wrap{max-width:900px;margin:auto}h1{font-size:28px;margin:0 0 8px}.muted{color:#777;margin-bottom:24px}.auth{display:flex;gap:10px;margin-bottom:24px}input,button{border:1px solid #29292f;background:#0d0d10;color:#fff;border-radius:14px;padding:14px 16px;font-size:15px}input{flex:1}button{cursor:pointer;font-weight:650}.session{border:1px solid #202026;background:#0a0a0d;border-radius:20px;padding:18px;margin:12px 0}.head{display:flex;justify-content:space-between;gap:12px;color:#7d7d86;font-size:12px;margin-bottom:14px}.row{display:grid;grid-template-columns:90px 1fr 54px;gap:12px;padding:11px 0;border-top:1px solid #18181d;align-items:start}.stage{color:#8d8d96;text-transform:uppercase;font-size:11px;letter-spacing:.08em}.choice{font-weight:600}.lang{color:#666;text-align:right}.empty{color:#777;padding:30px 0}@media(max-width:600px){body{padding:22px 12px}.auth{flex-direction:column}.row{grid-template-columns:72px 1fr 34px}.session{padding:15px}}
</style>
</head>
<body><main class="wrap"><h1>Responses</h1><div class="muted">Parcours enregistrés depuis le site.</div><div class="auth"><input id="token" type="password" placeholder="ADMIN_TOKEN"><button id="load">Afficher</button></div><div id="status"></div><div id="content"></div></main>
<script>
const token=document.querySelector('#token'),content=document.querySelector('#content'),status=document.querySelector('#status');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
document.querySelector('#load').onclick=load;
async function load(){
  status.textContent='Chargement…';content.innerHTML='';
  try{
    const r=await fetch('/api/response?token='+encodeURIComponent(token.value));
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Erreur');
    const groups={};
    [...d.responses].reverse().forEach(x=>(groups[x.session_id]??=[]).push(x));
    const sessions=Object.entries(groups).sort((a,b)=>new Date(b[1][b[1].length-1].created_at)-new Date(a[1][a[1].length-1].created_at));
    status.textContent=sessions.length?`${sessions.length} session(s)`:'';
    if(!sessions.length){content.innerHTML='<div class="empty">Aucune réponse pour le moment.</div>';return}
    content.innerHTML=sessions.map(([id,rows])=>{const first=rows[0],last=rows[rows.length-1];return `<section class="session"><div class="head"><span>${esc(new Date(first.created_at).toLocaleString('fr-FR'))}</span><span>${rows.some(x=>x.stage==='completed')?'✓ terminé':'en cours'}</span></div>${rows.map(x=>`<div class="row"><div class="stage">${esc(x.stage)}</div><div class="choice">${esc(x.choice)}</div><div class="lang">${esc(x.lang.toUpperCase())}</div></div>`).join('')}</section>`}).join('');
  }catch(e){status.textContent='Impossible de charger : '+e.message}
}
</script></body></html>
