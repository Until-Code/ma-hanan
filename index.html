<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Hanan</title>
<style>
:root{--bg:#050505;--panel:#0c0c0f;--text:#f5f5f7;--muted:#8b8b93;--line:#24242a;--accent:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100svh;display:grid;place-items:center;overflow-x:hidden;padding:max(18px,env(safe-area-inset-top)) 0 max(18px,env(safe-area-inset-bottom))}
body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.055),transparent 28%);pointer-events:none}
.wrap{width:min(760px,92vw);position:relative;margin-inline:auto}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.brand-wrap{display:flex;flex-direction:column;gap:7px}.brand{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#666}.love-line{font-size:clamp(18px,3vw,25px);font-weight:650;letter-spacing:-.025em;min-height:31px;color:#fff}.love-line.rtl{direction:rtl;text-align:left;letter-spacing:0}.langs{display:flex;gap:7px;flex-wrap:wrap}.lang{border:1px solid var(--line);background:#09090b;color:#777;padding:7px 10px;border-radius:999px;cursor:pointer;font-size:11px;transition:.25s}.lang.active,.lang:hover{color:#fff;border-color:#555;background:#111}
.card{min-height:410px;border:1px solid #1d1d22;background:linear-gradient(145deg,rgba(17,17,20,.92),rgba(6,6,7,.96));border-radius:28px;padding:clamp(28px,6vw,54px);box-shadow:0 35px 90px rgba(0,0,0,.55);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.step{position:absolute;top:26px;left:30px;color:#555;font-size:11px;letter-spacing:.16em}.text{font-size:clamp(27px,5vw,48px);line-height:1.08;letter-spacing:-.035em;font-weight:650;min-height:120px}.text.rtl{direction:rtl;text-align:right;letter-spacing:0;line-height:1.45}.answers{display:grid;gap:10px;margin-top:34px}.answer{width:100%;min-height:72px;text-align:left;border:1px solid #f4f4f5;background:#f4f4f5;color:#080808;border-radius:18px;padding:22px 24px;font-size:17px;font-weight:600;cursor:pointer;transition:.22s;opacity:0;transform:translateY(10px);animation:in .45s forwards}.answer:nth-child(2){animation-delay:.08s}.answer:nth-child(3){animation-delay:.16s}.answer:hover{background:#ffffff;color:#080808;border-color:#ffffff;transform:translateY(-1px)}.answer.rtl{text-align:right;direction:rtl}.progress{height:2px;background:#18181c;margin-top:20px;border-radius:99px;overflow:hidden}.bar{height:100%;background:#eee;width:20%;transition:width .55s cubic-bezier(.2,.8,.2,1)}.typing:after{content:"|";margin-left:4px;animation:blink .75s infinite;color:#777}.interlude{color:#cfcfd4;font-weight:500;font-size:clamp(23px,4vw,39px)}.loading-scene{display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:24px;animation:fadeUp .45s both}.loading-scene img{width:min(320px,76vw);aspect-ratio:4/3;object-fit:cover;border-radius:22px;border:1px solid #26262d;filter:brightness(.76) saturate(.92)}.loading-line{font-size:15px;color:#bdbdc6;letter-spacing:.02em}.loading-dots:after{content:'...';display:inline-block;width:22px;overflow:hidden;vertical-align:bottom;animation:dots 1.1s steps(4,end) infinite}@keyframes dots{0%{width:0}100%{width:22px}}.reaction-video{display:block;width:min(320px,78vw);margin:22px auto 0;max-height:360px;object-fit:cover;border-radius:22px;border:1px solid #292930;background:#000;animation:fadeUp .4s both}.reaction-image{display:block;width:min(320px,78vw);margin:22px auto 0;aspect-ratio:4/3;object-fit:cover;border-radius:22px;border:1px solid #292930;filter:brightness(.8) saturate(.95);animation:fadeUp .4s both}
.final-wrap{display:none;width:100%}.final-wrap.show{display:block;animation:fadeUp .65s both}.final-question{font-size:clamp(26px,4.5vw,42px);line-height:1.08;letter-spacing:-.035em;font-weight:650;margin-bottom:24px}.final-question.rtl{direction:rtl;text-align:right;letter-spacing:0;line-height:1.45}.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}.photo-card{aspect-ratio:4/5;border-radius:20px;border:1px solid #24242a;overflow:hidden;background:#09090b;position:relative}.photo-card img{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(.84) saturate(.96);transition:.45s}.photo-card:hover img{transform:scale(1.025);filter:brightness(.92) saturate(1)}.photo-card:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.3),transparent 45%);pointer-events:none}.final-answer{border-color:#303038;background:#0b0b0e}.outcome{margin-top:22px;padding:22px;border:1px solid #25252b;border-radius:20px;background:rgba(12,12,15,.9);font-size:18px;line-height:1.35;font-weight:650;animation:fadeUp .45s both}.outcome.rtl{direction:rtl;text-align:right}.money-options{display:grid;gap:10px;margin-top:14px}.money-option{min-height:62px;border:1px solid #f4f4f5;background:#f4f4f5;color:#080808;border-radius:17px;padding:18px 20px;font-size:16px;font-weight:650;text-align:left;cursor:pointer;position:relative;z-index:5;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.money-option.rtl{text-align:right;direction:rtl}.finish-message{margin-top:13px;color:#bdbdc6;font-size:14px;font-weight:500}.tiny-note{margin-top:15px;text-align:center;color:#4e4e55;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
@keyframes blink{50%{opacity:0}}@keyframes in{to{opacity:1;transform:translateY(0)}}@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:600px){body{place-items:start center;padding:max(14px,env(safe-area-inset-top)) 0 max(14px,env(safe-area-inset-bottom))}.wrap{width:min(430px,calc(100vw - 24px))}.top{align-items:flex-start;gap:12px;flex-direction:column;margin-bottom:14px}.love-line{font-size:21px;min-height:28px}.langs{gap:6px}.lang{padding:7px 11px}.card{min-height:min(690px,calc(100svh - 160px));max-height:none;border-radius:24px;padding:54px 22px 26px;justify-content:center}.step{top:19px;left:22px}.text{font-size:clamp(28px,7.4vw,36px);min-height:106px}.answers{gap:12px;margin-top:28px}.answer{min-height:74px;padding:21px 20px;font-size:17px;border-radius:19px}.loading-scene{gap:16px}.loading-scene img,.reaction-image{width:min(330px,82vw);border-radius:20px}.photo-grid{gap:10px}.photo-card{border-radius:17px}.final-question{font-size:clamp(26px,7vw,34px);margin-bottom:18px}.final-wrap{padding-bottom:4px}.outcome{padding:19px}.progress{margin-top:14px}}
@media(min-width:420px) and (max-width:440px) and (min-height:900px){.wrap{width:406px}.card{min-height:700px;padding:58px 24px 28px}.photo-card{aspect-ratio:4/5}.answer{min-height:76px;font-size:17px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div class="brand-wrap"><div class="brand">FOR HANAN</div><div class="love-line" id="loveLine"></div></div>
    <div class="langs"><button class="lang active" data-lang="en">EN</button><button class="lang" data-lang="fr">FR</button><button class="lang" data-lang="ar">AR</button><button class="lang" data-lang="ru">RU</button></div>
  </div>
  <section class="card">
    <div class="step" id="step">01 / 04</div>
    <div id="mainContent">
      <div class="text" id="text"></div>
      <div class="answers" id="answers"></div>
    </div>
    <div class="final-wrap" id="finalWrap">
      <div class="final-question" id="finalQuestion"></div>
      <div class="photo-grid">
        <div class="photo-card"><img alt="flowers" src="flowers.jpg"></div>
        <div class="photo-card"><img alt="dress" src="dress.jpg"></div>
      </div>
      <div class="answers" id="finalAnswers"></div>
      <div class="tiny-note">choose carefully ♡</div>
    </div>
  </section>
  <div class="progress"><div class="bar" id="bar"></div></div>
</main>
<script>
const copy={
 en:{love:"I love you, my Hanan",q1:"Why u so beautiful?",a1:["shut a fuck up","im saoudien","i love you"],inter:"I remember the first discussion we had and I’m always gonna love and feel this peaceful moment passed with u.",q2:"You are mine and not talking to you makes me feel empty in the day, don’t you?",a2:["like u ass ?","yeah sure","yes but you piss me off"],q3:"I love you, Hanan, and I always will. These memories with u, I wanna complete them with new ones with u by my side, so when?",a3:["in airport taiwan","come to riyadh","casse toi"],final:"What would you like me to get you so you’ll forgive me?",fa:["flowers and chocolate","i want nothing from you","my dress and fuck off","bitch, give me money"],ninja:"okay, ninja in process",finish:"let’s finish the shitty movie",reject:"response not accepted, dont have wifi",dressMsg:"okay packages in process, inshallah u gonna receive it",money:["shopping","hair","makeup / beauty"],homework:"homework finished, love u big ass."},
 fr:{love:"Je t’aime ma Hanan",q1:"Pourquoi t’es aussi belle ?",a1:["ferme ta putain de bouche","je suis saoudien","je t’aime"],inter:"Je me souviens de notre toute première discussion, et j’aimerai toujours ce moment paisible qu’on a partagé.",q2:"Tu es à moi, et ne pas te parler me laisse un vide dans ma journée. Toi aussi, non ?",a2:["genre ton cul ?","ouais bien sûr","oui mais tu me saoules"],q3:"Je t’aime, Hanan, et je t’aimerai toujours. Tous ces souvenirs avec toi, je veux les compléter avec de nouveaux, avec toi à mes côtés. Alors, quand ?",a3:["à l’aéroport à Taïwan","viens à Riyad","casse-toi"],final:"Pour me faire te pardonner, tu préfères quoi ?",fa:["des fleurs et du chocolat","je ne veux rien de toi","ma robe et casse-toi","bitch, donne-moi de l’argent"],ninja:"okay, ninja en cours",finish:"finissons ce film de merde",reject:"réponse refusée, pas de wifi",dressMsg:"okay colis en cours, inshallah tu vas le recevoir",money:["shopping","cheveux","maquillage / beauté"],homework:"homework finished, love u big ass."},
 ar:{love:"أحبك يا حنان",q1:"ليش إنتِ جميلة لهالدرجة؟",a1:["اسكت بس","أنا سعودي","أحبك"],inter:"أتذكر أول حديث بيننا، وسأظل أحب ذلك الشعور الهادئ والجميل الذي عشته معك.",q2:"إنتِ لي، ولما ما أكلمك أحس يومي فاضي… وإنتِ بعد، صح؟",a2:["تقصد مؤخرتك؟","أكيد","إيه بس ترفع ضغطي"],q3:"أحبك يا حنان، وسأظل أحبك دائماً. كل الذكريات اللي بيننا أبغى أكملها بذكريات جديدة وإنتِ بجانبي… متى؟",a3:["في مطار تايوان","تعال الرياض","انقلع"],final:"عشان تسامحيني، وش تفضلين؟",fa:["ورد وشوكولاتة","ما أبي منك شيء","فستاني وانقلع","يا بنت، عطيني فلوس"],ninja:"أوكي، النينجا بدأ المهمة",finish:"خلّينا نكمل الفيلم الزفت",reject:"الرد مرفوض، ما فيه واي فاي",dressMsg:"أوكي، الشحنة تحت الإجراء، إن شاء الله توصلك",money:["تسوّق","شعر","مكياج / جمال"],homework:"homework finished, love u big ass."},
 ru:{love:"Я люблю тебя, моя Ханан",q1:"Почему ты такая красивая?",a1:["да заткнись уже","я саудовец","я тебя люблю"],inter:"Я помню наш самый первый разговор и всегда буду любить то спокойное, тёплое чувство, которое испытал рядом с тобой.",q2:"Ты моя, и когда мы не разговариваем, мне весь день чего-то не хватает. У тебя тоже так, да?",a2:["типа твою задницу?","ну конечно","да, но ты меня бесишь"],q3:"Я люблю тебя, Ханан, и всегда буду любить. Я хочу дополнить наши воспоминания новыми — с тобой рядом. Так когда?",a3:["в аэропорту Тайваня","приезжай в Эр-Рияд","отвали"],final:"Чтобы я тебя простил, что ты предпочитаешь?",fa:["цветы и шоколад","мне ничего от тебя не нужно","моё платье и отвали","сучка, дай мне денег"],ninja:"окей, ниндзя уже в процессе",finish:"давай закончим этот дурацкий фильм",reject:"ответ не принят, нет вайфая",dressMsg:"окей, посылка уже в процессе, иншаллах ты её получишь",money:["шопинг","волосы","макияж / красота"],homework:"homework finished, love u big ass."}
};
let lang='en',stage=0,timer;
const sessionId=(crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`);
function track(stageName,choice){
  fetch('/api/response',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId,stage:stageName,choice,lang})}).catch(()=>{});
}
const text=document.querySelector('#text'),answers=document.querySelector('#answers'),step=document.querySelector('#step'),bar=document.querySelector('#bar'),loveLine=document.querySelector('#loveLine'),mainContent=document.querySelector('#mainContent'),finalWrap=document.querySelector('#finalWrap'),finalQuestion=document.querySelector('#finalQuestion'),finalAnswers=document.querySelector('#finalAnswers');
function type(el,str,done,speed=25){clearInterval(timer);el.textContent='';el.classList.add('typing');let i=0;timer=setInterval(()=>{el.textContent+=str[i++]||'';if(i>str.length){clearInterval(timer);el.classList.remove('typing');done&&done()}},speed)}
function showAnswers(arr,target=answers){target.innerHTML='';arr.forEach((x,i)=>{const b=document.createElement('button');b.className='answer'+(lang==='ar'?' rtl':'');b.textContent=x;b.onclick=()=>{if(target===finalAnswers){handleFinalChoice(i,b);return}const stageName=stage===0?'q1':stage===2?'q2':stage===4?'q3':'unknown';track(stageName,x);if(stage===0&&i===0){showGunReaction();return}if(stage===0&&i===1){showYallaReaction();return}if(stage===0&&i===2){showLoveReaction();return}next()};target.appendChild(b)})}
function showCleanFinal(imageSrc,message,subMessage=''){
  const photoGrid=document.querySelector('.photo-grid');
  finalAnswers.innerHTML='';
  photoGrid.style.display='grid';
  photoGrid.innerHTML=`<div class="photo-card" style="grid-column:1 / -1;max-width:360px;width:100%;margin:0 auto"><img src="${imageSrc}" alt="final choice"></div>`;
  const box=document.createElement('div');
  box.className='outcome'+(lang==='ar'?' rtl':'');
  box.innerHTML=`<div>${message}</div>${subMessage?`<div class="finish-message">${subMessage}</div>`:''}`;
  finalAnswers.after(box);

  // This is only an intermediate result. The global ending appears
  // after the selected final process has had time to be read.
  const delay=subMessage ? 3600 : 3200;
  setTimeout(()=>{track('completed','homework finished');showHomeworkFinal(copy[lang].homework)},delay);
}
function showHomeworkFinal(message){
  document.querySelectorAll('.outcome').forEach(x=>x.remove());
  finalQuestion.style.display='none';
  finalAnswers.innerHTML='';
  const photoGrid=document.querySelector('.photo-grid');
  photoGrid.style.display='none';
  document.querySelector('.tiny-note').style.display='none';
  const box=document.createElement('div');
  box.className='outcome'+(lang==='ar'?' rtl':'');
  box.style.marginTop='0';
  box.style.minHeight='280px';
  box.style.display='grid';
  box.style.placeItems='center';
  box.style.textAlign='center';
  box.style.fontSize='clamp(28px,6vw,44px)';
  box.textContent=message;
  finalWrap.appendChild(box);
}
function handleFinalChoice(i,button){
  const c=copy[lang];
  track('final',c.fa[i]);
  document.querySelectorAll('.outcome').forEach(x=>x.remove());
  if(i===1){
    const reject=document.createElement('div');
    reject.className='outcome'+(lang==='ar'?' rtl':'');
    reject.textContent=c.reject;
    button.insertAdjacentElement('afterend',reject);
    button.style.transition='opacity .55s ease, transform .55s ease, max-height .55s ease, margin .55s ease, padding .55s ease';
    reject.style.transition='opacity .45s ease, transform .45s ease';
    setTimeout(()=>{button.style.opacity='0';button.style.transform='translateY(-6px) scale(.97)';button.style.maxHeight='0';button.style.minHeight='0';button.style.margin='0';button.style.paddingTop='0';button.style.paddingBottom='0';button.style.borderWidth='0';},420);
    setTimeout(()=>{reject.style.opacity='0';reject.style.transform='translateY(-6px)';},1500);
    setTimeout(()=>{button.remove();reject.remove()},2000);
    return;
  }
  document.querySelector('.tiny-note').style.display='none';
  if(i===0){ showCleanFinal('flowers.jpg',c.ninja,c.finish); return; }
  if(i===2){ showCleanFinal('dress.jpg',c.dressMsg); return; }
  const photoGrid=document.querySelector('.photo-grid');
  photoGrid.style.display='none';
  finalAnswers.innerHTML='';
  const box=document.createElement('div');
  box.className='outcome'+(lang==='ar'?' rtl':'');
  const title=document.createElement('div');
  title.textContent=c.fa[3];
  const moneyWrap=document.createElement('div');
  moneyWrap.className='money-options';
  c.money.forEach(label=>{
    const btn=document.createElement('button');
    btn.type='button';
    btn.className='money-option'+(lang==='ar'?' rtl':'');
    btn.textContent=label;
    btn.onclick=(event)=>{
      event.preventDefault();
      event.stopPropagation();
      track('money',label);
      track('completed','homework finished');
      showHomeworkFinal(copy[lang].homework);
    };
    moneyWrap.appendChild(btn);
  });
  box.append(title,moneyWrap);
  finalAnswers.appendChild(box);
}
function showGunReaction(){answers.innerHTML='';const img=document.createElement('img');img.src='gun.jpeg';img.alt='reaction';img.className='reaction-image';answers.appendChild(img);setTimeout(()=>{stage=1;render()},1500)}
function showYallaReaction(){answers.innerHTML='';const video=document.createElement('video');video.src='yalla.mp4';video.className='reaction-video';video.autoplay=true;video.playsInline=true;video.setAttribute('playsinline','');video.controls=false;video.preload='auto';answers.appendChild(video);let moved=false;const proceed=()=>{if(moved)return;moved=true;stage=1;render()};video.addEventListener('ended',proceed,{once:true});video.addEventListener('error',()=>setTimeout(proceed,1800),{once:true});video.play().catch(()=>{video.controls=true;setTimeout(proceed,3500)});setTimeout(proceed,12000)}
function showLoveReaction(){answers.innerHTML='';text.className='text interlude'+(lang==='ar'?' rtl':'');type(text,'i love u too babe',()=>setTimeout(()=>{stage=1;render()},1800),34)}
function render(){const c=copy[lang];mainContent.style.display='block';finalWrap.classList.remove('show');answers.innerHTML='';text.className='text'+(lang==='ar'?' rtl':'');if(stage===0){step.textContent='01 / 04';bar.style.width='16%';type(text,c.q1,()=>showAnswers(c.a1))}else if(stage===1){step.textContent='…';bar.style.width='32%';text.className='text interlude'+(lang==='ar'?' rtl':'');type(text,c.inter,()=>setTimeout(()=>{stage=2;render()},3600))}else if(stage===2){step.textContent='02 / 04';bar.style.width='50%';type(text,c.q2,()=>showAnswers(c.a2))}else if(stage===3){step.textContent='…';bar.style.width='66%';text.textContent='';answers.innerHTML=`<div class="loading-scene"><img src="miss-you.jpg" alt="miss you"><div class="loading-line">wait, i don't have charger<span class="loading-dots"></span></div></div>`;setTimeout(()=>{stage=4;render()},4200)}else if(stage===4){step.textContent='03 / 04';bar.style.width='82%';type(text,c.q3,()=>showAnswers(c.a3))}else{step.textContent='04 / 04';bar.style.width='100%';mainContent.style.display='none';finalWrap.classList.add('show');const photoGrid=document.querySelector('.photo-grid');photoGrid.style.display='grid';photoGrid.innerHTML='<div class="photo-card"><img alt="flowers" src="flowers.jpg"></div><div class="photo-card"><img alt="dress" src="dress.jpg"></div>';document.querySelector('.tiny-note').style.display='block';document.querySelectorAll('.outcome').forEach(x=>x.remove());finalQuestion.style.display='block';finalQuestion.className='final-question'+(lang==='ar'?' rtl':'');finalQuestion.textContent=c.final;showAnswers(c.fa,finalAnswers)}}
function next(){if(stage===0)stage=1;else if(stage===2)stage=3;else if(stage===4)stage=5;else if(stage===5)return;render()}
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active',x===b));render()});
const loveCycle=['fr','ru','en','ar'];let loveIndex=0;
function cycleLove(){const l=loveCycle[loveIndex%loveCycle.length];loveLine.className='love-line'+(l==='ar'?' rtl':'');loveLine.style.opacity='0';loveLine.style.transform='translateY(5px)';setTimeout(()=>{loveLine.textContent=copy[l].love;loveLine.style.transition='opacity .45s, transform .45s';loveLine.style.opacity='1';loveLine.style.transform='translateY(0)'},220);loveIndex++;}
cycleLove();setInterval(cycleLove,2600);render();
</script>
</body>
</html>
